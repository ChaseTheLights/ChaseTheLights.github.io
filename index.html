<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Incomplete Project</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      color: #333;
    }
    .app-container {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background: #2c3e50;
      color: white;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,0.05);
    }

    .sidebar-header {
      padding: 1.5rem 1rem 1rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 1.5rem;
    }

    .sidebar-header h2 {
      font-size: 1.4rem;
      font-weight: bold;
      margin: 0 0 0.3rem 0;
      color: white;
    }

    .sidebar-header p {
      font-size: 0.8rem;
      color: #ccc;
      margin: 0;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0 1rem 2rem 1.5rem;
    }

    .nav-links a {
      display: block;
      background: transparent;
      padding: 0.7rem 1rem;
      text-decoration: none;
      font-weight: 500;
      color: #ecf0f1;
      border-radius: 8px;
      transition: all 0.2s ease;
      font-size: 1rem;
      box-shadow: none;
      transform: none;
      text-align: left;
    }

    .nav-links a:hover {
      background: #1a2a3a;
      color: white;
      transform: translateX(4px);
    }

    .main-content {
      flex: 1;
      background: #f4f4f9;
      padding: 1.5rem 2rem 2rem 2rem;
    }

    .page-header {
      background: #2c3e50;
      color: white;
      padding: 1.2rem 1.8rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: bold;
    }

    .page-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .main-footer {
      text-align: center;
      padding: 1rem;
      background: #2c3e50;
      color: white;
      border-radius: 12px;
      margin-top: 1.5rem;
    }

    @media (max-width: 700px) {
      .app-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        top: 0;
      }
      .main-content {
        padding: 1rem;
      }
    }
    hr {
      margin: 1rem 0;
      border: 0;
      border-top: 1px solid #ddd;
    }
    p, li {
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Navigation</h2>
    </div>
    <div class="nav-links">
      <a href="clubs.html">Clubs</a>
      <a href="Bunfest-2026.html">Bunfest - 2026</a>
    </div>
    <div style="margin-top: 2rem; padding: 0 1.5rem 1rem 1.5rem; font-size: 0.7rem; color: #9aaebf;">
      <hr style="border-color: #3a546d;">
      <p>© 2025 - 2026 | Chase The Light</p>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>Index</h1>
    </div>

    <div class="main-footer">
      <p>&copy; 2025 - 2026 | Chase The Light - An Incomplete Project</p>
    </div>
  </main>
</div>

</body>
</html>
