<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Incomplete Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f9;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    nav {
      width: 260px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    a {
      display: block;
      background: white;
      padding: 1.2rem;
      text-align: center;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      color: #2c3e50;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s, background 0.2s;
    }

    a:hover {
      transform: scale(1.05);
      background: #ecf0f1;
    }

    .content {
      flex: 1;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-left: 1px solid #ddd;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #2c3e50;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Index</h1>
  </header>

  <div class="main">
    <nav>
      <a href="clubs.html" target="contentFrame">Clubs</a>
      <a href="Bunfest-2026.html" target="contentFrame">Bunfest - 2026</a>
    </nav>

    <div class="content">
      <iframe name="contentFrame" src="clubs.html"></iframe>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 - 2026 | Chase The Light - An Incomplete Project</p>
  </footer>
</body>
</html>
